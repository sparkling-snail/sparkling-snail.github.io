name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.140.2
    steps:
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        # The site lives under /teoweetin/; the bare domain redirects there.
        run: |
          hugo --gc --minify --destination public/teoweetin
          # Preview copy with drafts (unlisted, noindex) at /teoweetin/preview/
          hugo --minify --buildDrafts --environment preview \
            --baseURL "${{ steps.pages.outputs.base_url }}/teoweetin/preview/" \
            --destination public/teoweetin/preview
          cp root/index.html public/index.html
          cp public/teoweetin/404.html public/404.html 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
