baseURL = "https://sparkling-snail.github.io/teoweetin/"
languageCode = "en-sg"
title = "Wee Tin"
enableRobotsTXT = true
capitalizeListTitles = false

[params]
  name = "Teo Wee Tin"
  role = "Site Reliability Engineer · GPU inference"
  description = "SRE on GPU model serving at scale. Building inference engines from scratch on the side."
  github = "https://github.com/sparkling-snail"
  linkedin = ""   # e.g. "https://www.linkedin.com/in/your-handle"
  email = ""      # optional public email
  resume = ""     # e.g. "resume.pdf" (put the file in static/)
  avatar = ""     # e.g. "images/avatar.jpg" (put the file in static/images/). Initials are shown if empty.

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 5
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 10
  [[menus.main]]
    name = "Writing"
    pageRef = "/posts"
    weight = 20
  [[menus.main]]
    name = "About"
    pageRef = "/about"
