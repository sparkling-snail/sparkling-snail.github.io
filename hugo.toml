baseURL = "https://sparkling-snail.github.io/teoweetin/"
languageCode = "en-sg"
title = "Wee Tin"
enableRobotsTXT = true
capitalizeListTitles = false

[params]
  name = "Teo Wee Tin"
  role = "AI engineer · LLM serving and agents"
  description = "AI engineer working across the stack: LLM serving infrastructure and the agents built on top of it. SRE on GPU model serving at ByteDance/TikTok."
  github = "https://github.com/sparkling-snail"
  linkedin = ""   # e.g. "https://www.linkedin.com/in/your-handle"
  email = ""      # optional public email
  resume = ""     # e.g. "resume.pdf" (put the file in static/)
  avatar = ""     # e.g. "images/avatar.jpg" (put the file in static/images/). Initials are shown if empty.

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 5
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 10
  [[menus.main]]
    name = "Experience"
    pageRef = "/experience"
    weight = 15
  [[menus.main]]
    name = "Writing"
    pageRef = "/posts"
    weight = 20

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
